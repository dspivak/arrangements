<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feeding · Arrangement explorer</title><link rel="stylesheet" href="explorer.css"><link rel="stylesheet" href="feeding-view.css"></head>
<body>
<nav aria-label="Other arrangements" style="max-width:75rem;margin:.8rem auto;padding:0 1rem"><a class="ex-link" href="hodgkin-huxley-explorer.html">Explore Hodgkin–Huxley with ATP</a></nav>
<section id="feeding-view" class="feeding-ui"></section>
<main id="explorer"></main>
<form id="add-casing" style="max-width:75rem;margin:1rem auto;padding:0 1rem">
  <label>Place on the line <input id="place" type="number" step="any" value="0" required></label>
  <button type="submit">Add a full casing</button>
</form>
<script src="feeding-model.js"></script>
<script src="food-learning.js"></script>
<script src="feeding-view.js"></script>
<script src="explorer-core.js"></script>
<script src="explorer-layout.js"></script>
<script src="explorer-forms.js"></script>
<script src="explorer.js"></script>
<script src="feeding-arrangement.js"></script>
<script src="feeding-animations.js"></script>
<script>
const rootView = document.getElementById('feeding-view');
let explorer;
const feeding = createFeedingView(rootView, {
  onChange() { explorer?.refresh(); },
  openReceiver() { explorer.enter('receiver'); explorer.crumbs.scrollIntoView({block: 'start'}); }
});
const adapter = {snapshot: () => feeding.observe(FeedingArrangement.observeLearning)};
explorer = new ArrangementExplorer.View(document.getElementById('explorer'), adapter, {
  renderers: FeedingAnimations, storageKey: 'feeding-learning-explorer-v1',
  rootAnimation: rootView,
  playback: feeding,
  description: 'The receiver uses the same gripper, opener and digestor for every casing.'
});
// feeding-explorer.html?scope=wheels opens the page at that level (a part's id), scrolled to the diagram.
const opened = new URLSearchParams(location.search).get('scope');
if (opened) { explorer.enter(opened); explorer.crumbs.scrollIntoView({block: 'start'}); }
document.getElementById('add-casing').addEventListener('submit', event => {
  event.preventDefault();
  feeding.addCasing(10, document.getElementById('place').valueAsNumber);
});
</script>
</body></html>
